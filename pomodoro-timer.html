<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer Online | TabKit Tools</title>
  <link rel="manifest" href="/manifest.json" />
  
  <meta name="description" content="A simple, minimalist Pomodoro focus timer to track work sprints and breaks. 100% offline-ready inside your browser." />
  <meta name="keywords" content="pomodoro timer, focus timer, offline timer, productivity clock, 25 minute timer, work sprint" />
  <link rel="canonical" href="https://tabkit.tools/pomodoro-timer.html" />

  <meta property="og:title" content="Pomodoro Timer Online | TabKit Tools" />
  <meta property="og:description" content="Minimalist, offline-ready Pomodoro timer for deep focus sessions." />
  <meta property="og:url" content="https://tabkit.tools/pomodoro-timer.html" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />
  <script src="components.js"></script>
</head>

<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col selection:bg-workspace-accent selection:text-black">

  <tool-header tool-name="pomodoro-timer"></tool-header>

  <main class="flex-1 flex flex-col items-center justify-center max-w-2xl w-full mx-auto px-4 py-12">
    
    <div class="text-center w-full mb-8">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-workspace-accent/10 border border-workspace-accent/30 text-workspace-accent text-xs font-mono mb-4">
        <span class="w-2 h-2 rounded-full bg-workspace-accent animate-pulse"></span>
        Zero Distractions
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Focus Timer</h1>
    </div>

    <!-- The Tool -->
    <div class="rounded-3xl border border-workspace-border bg-workspace-surface shadow-2xl p-8 sm:p-12 w-full flex flex-col items-center space-y-8">
      
      <!-- Interval Selector -->
      <div class="flex gap-2 bg-workspace-bg p-1.5 rounded-xl border border-workspace-border text-sm font-bold w-full max-w-xs mx-auto">
        <button id="btn_mode_25" onclick="setTimer(25)" class="flex-1 py-2.5 rounded-lg bg-workspace-surface text-workspace-text shadow transition-colors border border-workspace-borderLight">25m Work</button>
        <button id="btn_mode_5" onclick="setTimer(5)" class="flex-1 py-2.5 rounded-lg text-workspace-muted hover:text-workspace-text border border-transparent transition-colors">5m Break</button>
      </div>

      <!-- Clock Display -->
      <div class="relative flex items-center justify-center w-64 h-64 rounded-full bg-workspace-bg border-4 border-workspace-borderLight shadow-inner mx-auto my-4">
        <div id="pomo_display" class="text-6xl sm:text-7xl font-bold font-mono text-workspace-accent tracking-widest">25:00</div>
      </div>

      <!-- Action Button -->
      <button id="pomo_btnToggle" onclick="toggleTimer()" class="w-full max-w-xs py-4 bg-workspace-accent text-black font-extrabold text-lg uppercase tracking-widest rounded-2xl hover:bg-workspace-accentHover transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]">
        Start Focus
      </button>

    </div>

  </main>

  <tabkit-footer></tabkit-footer>

  <div id="toastContainer" class="fixed bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto px-4 py-2 rounded-lg bg-workspace-surface border border-workspace-border shadow-xl text-xs font-mono flex items-center gap-2 text-workspace-text transition-all duration-300 opacity-0 translate-y-2';
      toast.innerHTML = `<span class="text-workspace-accent">●</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2400);
    }

    let timeLeft = 25 * 60;
    let isRunning = false;
    let interval = null;
    const originalTitle = document.title;

    function toggleTimer() {
      if (isRunning) {
        clearInterval(interval);
        isRunning = false;
        document.getElementById('pomo_btnToggle').textContent = 'Resume';
        document.getElementById('pomo_btnToggle').className = "w-full max-w-xs py-4 bg-workspace-bg text-workspace-text border border-workspace-border hover:border-workspace-borderLight font-extrabold text-lg uppercase tracking-widest rounded-2xl transition-all";
      } else {
        isRunning = true;
        document.getElementById('pomo_btnToggle').textContent = 'Pause';
        document.getElementById('pomo_btnToggle').className = "w-full max-w-xs py-4 bg-workspace-surface text-workspace-accent border border-workspace-border hover:border-workspace-borderLight font-extrabold text-lg uppercase tracking-widest rounded-2xl transition-all shadow-inner";
        
        interval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(interval);
            isRunning = false;
            document.getElementById('pomo_btnToggle').textContent = 'Start';
            document.title = `Time's up! - ${originalTitle}`;
            showToast('Time is up! Great work.');
            
            // Try to play a subtle ping if browser allows
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              osc.connect(ctx.destination);
              osc.frequency.value = 800;
              osc.start();
              osc.stop(ctx.currentTime + 0.2);
            } catch(e){}
          }
        }, 1000);
      }
    }

    function setTimer(minutes) {
      clearInterval(interval);
      isRunning = false;
      timeLeft = minutes * 60;
      
      document.getElementById('pomo_btnToggle').textContent = 'Start Focus';
      document.getElementById('pomo_btnToggle').className = "w-full max-w-xs py-4 bg-workspace-accent text-black font-extrabold text-lg uppercase tracking-widest rounded-2xl hover:bg-workspace-accentHover transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]";
      
      const b25 = document.getElementById('btn_mode_25');
      const b5 = document.getElementById('btn_mode_5');
      
      if(minutes === 25) {
        b25.className = "flex-1 py-2.5 rounded-lg bg-workspace-surface text-workspace-text shadow transition-colors border border-workspace-borderLight";
        b5.className = "flex-1 py-2.5 rounded-lg text-workspace-muted hover:text-workspace-text border border-transparent transition-colors";
      } else {
        b5.className = "flex-1 py-2.5 rounded-lg bg-workspace-surface text-workspace-text shadow transition-colors border border-workspace-borderLight";
        b25.className = "flex-1 py-2.5 rounded-lg text-workspace-muted hover:text-workspace-text border border-transparent transition-colors";
      }

      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      const timeStr = `${m}:${s}`;
      
      document.getElementById('pomo_display').textContent = timeStr;
      if (isRunning) {
        document.title = `(${timeStr}) Focus | TabKit Tools`;
      } else {
        document.title = originalTitle;
      }
    }

    updateTimerDisplay();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
    }
  </script>
</body>
</html>
