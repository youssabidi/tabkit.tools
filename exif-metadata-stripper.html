<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo EXIF & GPS Metadata Stripper | TabKit Tools</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="description" content="Strip hidden GPS coordinates, camera serial numbers, and device metadata from photos before sharing." />
  <link rel="stylesheet" href="styles.css" />
  <script src="components.js"></script>
  <script src="utils.js"></script>
  <script src="registry.js"></script>
</head>
<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col selection:bg-workspace-accent selection:text-black">
  <tool-header tool-name="exif-metadata-stripper"></tool-header>
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 md:py-12">
    <div class="mb-8 text-center max-w-2xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-3">Photo EXIF & GPS Metadata Stripper</h1>
      <p class="text-sm text-workspace-muted leading-relaxed">Strip hidden GPS coordinates, camera serial numbers, and device metadata from photos before sharing.</p>
    </div>
    <!-- Increased height to comfortably fit file droppers and controls -->
    <div class="rounded-2xl border border-workspace-border bg-workspace-surface shadow-2xl p-6 mb-16 max-w-2xl mx-auto min-h-[500px] flex flex-col">
      <div id="tool-container" class="flex-1 w-full relative"></div>
    </div>
  </main>
  <tabkit-footer></tabkit-footer>
  <div id="toastContainer" class="fixed bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const tool = await loadTool('exif-metadata-stripper');
        const container = document.getElementById('tool-container');
        container.innerHTML = tool.render('exif-metadata-stripper');
        tool.init('exif-metadata-stripper');
      } catch (e) {
        console.error('Error loading tool:', e);
      }
    });
  </script>
</body>
</html>
