<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | TabKit Tools</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <main class="max-w-lg w-full bg-workspace-surface border border-workspace-border rounded-2xl p-8 space-y-5 shadow-xl">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-workspace-bg border border-workspace-border text-xs font-mono text-workspace-accent">
      404 &bull; NOT FOUND
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold text-white">Utility or Page Not Found</h1>
    <p class="text-sm text-workspace-muted leading-relaxed">
      The requested route does not exist on TabKit Tools. Return to the local-first workbench to browse all available utilities.
    </p>
    <div class="flex items-center justify-center gap-3 pt-2">
      <a href="/" class="px-5 py-2.5 rounded-xl bg-workspace-accent text-black text-sm font-semibold hover:opacity-90 transition">
        Open Workbench
      </a>
      <a href="/guide" class="px-5 py-2.5 rounded-xl border border-workspace-border text-workspace-text text-sm font-semibold hover:border-workspace-accent transition">
        User Guide
      </a>
    </div>
  </main>
</body>
</html>
