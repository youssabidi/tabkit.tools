<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabkit.tools — Something Big Is Coming</title>
  <meta name="description" content="Something game-changing is landing here. Stay tuned." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #07090E;
      --primary: #38BDF8;
      --accent: #818CF8;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --border-glow: rgba(56, 189, 248, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.12) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 680px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--primary);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-mark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 7vw, 4.25rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #FFFFFF 20%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.teaser {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      font-weight: 500;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 540px;
      margin-bottom: 40px;
    }

    .highlight {
      color: #FFFFFF;
      font-weight: 700;
    }

    .accent-bar {
      width: 60px;
      height: 3px;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      box-shadow: 0 0 16px var(--primary);
      margin-bottom: 40px;
    }

    footer {
      font-size: 13px;
      color: #475569;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Incoming Transmission</span>
    </div>

    <div class="brand-mark">tabkit.tools</div>
    
    <h1>Something game-changing is landing here.</h1>
    
    <p class="teaser">
      Your browser workflow will never be the same. <span class="highlight">Fast, modern, and built differently.</span>
    </p>

    <div class="accent-bar"></div>

    <footer>
      &copy; 2026 tabkit.tools &bull; Cloudflare Edge Network
    </footer>
  </div>

</body>
</html>
