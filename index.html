<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>tabkit.tools — Tab Management, Simplified.</title>
  <meta name="description" content="A fast, distraction-free tab manager and browser productivity toolkit. Coming soon." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #090B10;
      --surface: #11141D;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #38BDF8;
      --text: #F8FAFC;
      --muted: #8E9BAE;
      --accent: #38BDF8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 28px;
    }

    /* Minimal Top Header */
    header {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }

    .status-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 9999px;
    }

    /* Hero / Core Message */
    main {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: auto 0;
      padding: 32px 0;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 6.5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #FFFFFF;
      margin-bottom: 16px;
    }

    p.description {
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 32px;
      max-width: 480px;
    }

    /* Clean Input Form */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 480px) {
      form {
        flex-direction: row;
      }
    }

    input[type="email"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="email"]::placeholder {
      color: #556275;
    }

    input[type="email"]:focus {
      border-color: var(--border-focus);
    }

    button {
      background: #FFFFFF;
      color: #090B10;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .success-alert {
      display: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      margin-top: 8px;
    }

    /* Minimal Footer */
    footer {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #556275;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">tabkit.tools</a>
    <span class="status-tag">Coming Soon</span>
  </header>

  <main>
    <h1>Tabs, tamed.</h1>
    <p class="description">
      A fast, minimal workspace manager designed to keep your browser light and your mind clear. No clutter, no accounts required.
    </p>

    <form id="waitlist-form" onsubmit="handleSubmit(event)">
      <input 
        type="email" 
        id="email" 
        placeholder="Enter your email for early access" 
        required 
        autocomplete="email" 
      />
      <button type="submit">Notify Me</button>
    </form>

    <div id="success-message" class="success-alert">
      You are on the list. We will send an invite when ready.
    </div>
  </main>

  <footer>
    <span>&copy; 2026 tabkit.tools</span>
    <span>Cloudflare Pages</span>
  </footer>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('email');
      const val = input.value.trim();
      if (!val) return;

      try {
        const list = JSON.parse(localStorage.getItem('tabkit_waitlist') || '[]');
        if (!list.includes(val)) {
          list.push(val);
          localStorage.setItem('tabkit_waitlist', JSON.stringify(list));
        }
      } catch (err) {}

      document.getElementById('waitlist-form').style.display = 'none';
      document.getElementById('success-message').style.display = 'block';
    }
  </script>

</body>
</html>
