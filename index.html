  <!-- ==================== CORE SCRIPT ==================== -->
  <script>
    let citiesDataset = null;
    let isFetchingCities = false;

    async function loadCitiesDatabase(onProgress) {
      if (citiesDataset) return citiesDataset;
      if (isFetchingCities) return null;
      isFetchingCities = true;

      try {
        if (onProgress) onProgress('Loading cities...');
        const res = await fetch('/cities.min.json');
        if (!res.ok) throw new Error('cities.min.json not found');
        const raw = await res.json();
        
        // Format A: Object containing an indexed array { tz: [...], c: [...] }
        if (raw && raw.tz && Array.isArray(raw.c)) {
          const tzList = raw.tz;
          citiesDataset = raw.c.map(item => ({
            city: item[0],
            country: item[1] || '',
            iana: tzList[item[2]],
            tokens: `${item[0]} ${item[1] || ''} ${tzList[item[2]]}`.toLowerCase()
          }));
        } 
        // Format B: Array of compact arrays [name, country, iana, lat, lon]
        else if (Array.isArray(raw) && raw.length && Array.isArray(raw[0])) {
          citiesDataset = raw.map(item => ({
            city: item[0],
            country: item[1] || '',
            iana: item[2],
            tokens: `${item[0]} ${item[1] || ''} ${item[2]}`.toLowerCase()
          })).filter(x => x.city && x.iana);
        }
        // Format C: Standard Array of Objects [{ name: "...", country: "...", tz: "..." }]
        else if (Array.isArray(raw) && raw.length && typeof raw[0] === 'object') {
          citiesDataset = raw.map(item => {
            const city = item.name || item.city || '';
            const country = item.country || item.country_name || '';
            const iana = item.timezone || item.tz || item.iana || '';
            return { city, country, iana, tokens: `${city} ${country} ${iana}`.toLowerCase() };
          }).filter(x => x.city && x.iana);
        }

        if (onProgress) onProgress('');
        return citiesDataset;
      } catch (e) {
        if (onProgress) onProgress('');
        return fallbackIntlZones();
      } finally {
        isFetchingCities = false;
      }
    }

    function fallbackIntlZones() {
      let raw = [];
      if (typeof Intl !== 'undefined' && typeof Intl.supportedValuesOf === 'function') {
        try { raw = Intl.supportedValuesOf('timeZone'); } catch(e){}
      }
      if (!raw || !raw.length) {
        raw = ['UTC', 'Asia/Qatar', 'Africa/Tunis', 'Asia/Tokyo', 'America/New_York', 'America/Los_Angeles', 'Europe/London', 'Europe/Paris'];
      }
      return raw.map(iana => {
        const parts = iana.split('/');
        const city = parts[parts.length - 1].replace(/_/g, ' ');
        return { city, country: parts[0], iana, tokens: `${city} ${parts[0]} ${iana}`.toLowerCase() };
      });
    }

    const CONVERTER_CONFIG = {

    const TOOLS_REGISTRY = {
      'scratchpad': {
        id: 'scratchpad',
        name: 'Scratchpad & Diff',
        category: 'Workspace',
        description: 'Auto-saving multi-block notes and split-screen line difference comparison.',
        render: (toolId) => `
          <div class="flex flex-col h-full space-y-3 font-sans">
            <div class="flex items-center justify-between text-xs">
              <div class="flex gap-1 bg-workspace-bg p-0.5 rounded-lg border border-workspace-border">
                <button id="${toolId}_tabNote" onclick="toggleScratchMode('${toolId}', 'notes')" class="px-2 py-0.5 rounded text-[11px] font-medium bg-workspace-surface text-workspace-accent">Notes</button>
                <button id="${toolId}_tabDiff" onclick="toggleScratchMode('${toolId}', 'diff')" class="px-2 py-0.5 rounded text-[11px] font-medium text-workspace-muted hover:text-workspace-text">Diff</button>
              </div>
              <span id="${toolId}_saveStatus" class="text-[10px] text-workspace-muted font-mono">Synced</span>
            </div>
            <div id="${toolId}_notesContainer" class="flex-1 flex flex-col space-y-2">
              <textarea id="${toolId}_textarea" class="w-full h-44 bg-workspace-bg border border-workspace-border rounded-lg p-3 text-xs font-mono text-workspace-text placeholder-workspace-muted focus:border-workspace-borderLight focus:outline-none resize-none" placeholder="Type or paste quick notes here (auto-saved locally)..."></textarea>
            </div>
            <div id="${toolId}_diffContainer" class="hidden flex-1 flex flex-col space-y-2">
              <div class="grid grid-cols-2 gap-2 h-36">
                <textarea id="${toolId}_diffA" class="w-full h-full bg-workspace-bg border border-workspace-border rounded-lg p-2 text-[11px] font-mono text-workspace-text placeholder-workspace-muted focus:outline-none resize-none" placeholder="Original text..."></textarea>
                <textarea id="${toolId}_diffB" class="w-full h-full bg-workspace-bg border border-workspace-border rounded-lg p-2 text-[11px] font-mono text-workspace-text placeholder-workspace-muted focus:outline-none resize-none" placeholder="Modified text..."></textarea>
              </div>
              <button onclick="runTextDiff('${toolId}')" class="w-full py-1 bg-workspace-bg border border-workspace-border hover:border-workspace-accent text-[11px] rounded text-workspace-text font-mono transition-all">Compare Lines</button>
              <div id="${toolId}_diffOutput" class="max-h-24 overflow-y-auto p-2 bg-workspace-bg border border-workspace-border rounded text-[10px] font-mono space-y-0.5"></div>
            </div>
          </div>
        `,
        init: (toolId) => {
          const textarea = document.getElementById(`${toolId}_textarea`);
          const status = document.getElementById(`${toolId}_saveStatus`);
          const saved = localStorage.getItem(`tabkit_scratchpad_data`);
          if (saved) textarea.value = saved;

          textarea.addEventListener('input', () => {
            localStorage.setItem(`tabkit_scratchpad_data`, textarea.value);
            status.textContent = 'Saving...';
            setTimeout(() => {
              status.textContent = 'Synced';
              updateStorageIndicator();
            }, 300);
          });

            <div class="flex items-center gap-2">

      'timezone-buddy': {

        init: (toolId) => {
          let pinned = JSON.parse(localStorage.getItem('tabkit_tz_pinned') || '["Asia/Qatar", "Africa/Tunis", "UTC", "America/New_York"]');
          const slider = document.getElementById(`${toolId}_slider`);
          const label = document.getElementById(`${toolId}_selectedHour`);
          const container = document.getElementById(`${toolId}_zonesContainer`);
          const search = document.getElementById(`${toolId}_search`);
          const results = document.getElementById(`${toolId}_results`);
          const badge = document.getElementById(`${toolId}_statusBadge`);
          let searchDebounceTimer = null;

          const currentUtc = new Date().getUTCHours();
          slider.value = currentUtc;
          label.textContent = `${String(currentUtc).padStart(2, '0')}:00 UTC`;

          function getZoneDisplay(iana, utcHour) {
            try {
              const now = new Date();
              const date = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), utcHour, 0, 0));
              const timeStr = date.toLocaleTimeString('en-US', { timeZone: iana, hour: '2-digit', minute: '2-digit', hour12: false });
              const hour = parseInt(timeStr.split(':')[0], 10);
              const isWork = hour >= 9 && hour <= 18;
              return { timeStr, isWork };
            } catch (e) {
              return { timeStr: '--:--', isWork: false };
            }
          }

          function renderPinnedZones() {
            container.innerHTML = pinned.map(iana => {
              const parts = iana.split('/');
              const title = parts[parts.length - 1].replace(/_/g, ' ');
              const subtitle = parts[0] || 'Zone';
              const { timeStr, isWork } = getZoneDisplay(iana, parseInt(slider.value, 10));

              return `
                <div class="flex items-center justify-between p-2 rounded bg-workspace-bg border border-workspace-border">
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="text-workspace-text font-bold">${title}</span>
                      <span class="text-workspace-muted text-[11px]">— ${subtitle}</span>
                    </div>
                    <span class="text-[10px] text-workspace-muted">${iana}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm ${isWork ? 'text-workspace-accent' : 'text-workspace-muted'}">${timeStr}</span>
                    <button data-remove-iana="${iana}" title="Remove zone" class="text-workspace-muted hover:text-workspace-danger p-0.5 rounded text-xs leading-none">×</button>
                  </div>
                </div>
              `;
            }).join('');

            container.querySelectorAll('[data-remove-iana]').forEach(btn => {
              btn.onclick = () => {
                pinned = pinned.filter(z => z !== btn.dataset.removeIana);
                localStorage.setItem('tabkit_tz_pinned', JSON.stringify(pinned));
                renderPinnedZones();
                updateStorageIndicator();
              };
            });
          }

          slider.oninput = () => {
            label.textContent = `${String(slider.value).padStart(2, '0')}:00 UTC`;
            renderPinnedZones();
          };

          search.addEventListener('focus', async () => {
            if (!citiesDataset) {
              badge.classList.remove('hidden');
              await loadCitiesDatabase((msg) => {
                badge.textContent = msg;
                if (!msg) badge.classList.add('hidden');
              });
            }
          });

          // Debounced, hard-capped zero-lag search loop
          search.oninput = () => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(async () => {
              const q = search.value.toLowerCase().trim();
              if (q.length < 2) {
                results.classList.add('hidden');
                return;
              }

              const data = await loadCitiesDatabase();
              if (!data) return;

              const matches = [];
              for (let i = 0; i < data.length; i++) {
                if (data[i].tokens.includes(q)) {
                  matches.push(data[i]);
                  // Strict hard-cap to eliminate DOM lag
                  if (matches.length >= 15) break;
                }
              }

              if (!matches.length) {
                results.innerHTML = `<div class="p-2 text-center text-workspace-muted text-xs font-mono">No matching cities found</div>`;
              } else {
                results.innerHTML = matches.map(item => `
                  <div data-pick-iana="${item.iana}" class="p-2 hover:bg-workspace-surfaceHover rounded cursor-pointer flex items-center justify-between">
                    <div>
                      <span class="font-bold text-workspace-text">${item.city}</span>
                      <span class="text-workspace-muted text-[11px]">${item.country ? ' (' + item.country + ')' : ''}</span>
                    </div>
                    <span class="text-[10px] font-mono text-workspace-accent">${item.iana}</span>
                  </div>
                `).join('');

                results.querySelectorAll('[data-pick-iana]').forEach(row => {
                  row.onclick = () => {
                    const pick = row.dataset.pickIana;
                    if (!pinned.includes(pick)) {
                      pinned.push(pick);
                      localStorage.setItem('tabkit_tz_pinned', JSON.stringify(pinned));
                      renderPinnedZones();
                      updateStorageIndicator();
                    }
                    search.value = '';
                    results.classList.add('hidden');
                  };
                });
              }
              results.classList.remove('hidden');
            }, 150);
          };

          document.addEventListener('click', (e) => {
            if (!search.contains(e.target) && !results.contains(e.target)) {
              results.classList.add('hidden');
            }
          });

          renderPinnedZones();
        }
      },

      'unit-converter': {
        id: 'unit-converter',
        name: 'Everyday Converter',
        category: 'Utilities',
        description: 'Multi-category converter for data, length, mass, temperature, speed, volume, and time.',
        render: (toolId) => `
          <div class="flex flex-col h-full space-y-3 font-sans">
            <div class="flex items-center justify-between gap-2">
              <select id="${toolId}_category" class="flex-1 bg-workspace-bg border border-workspace-border rounded-lg p-1.5 text-xs font-mono text-workspace-text focus:border-workspace-accent focus:outline-none">

                <option value="2">2 dec</option>
                <option value="4" selected>4 dec</option>
                <option value="6">6 dec</option>
                <option value="0">0 dec</option>
              </select>
            </div>
            <div class="grid grid-cols-[1fr,auto,1fr] gap-2 items-center font-mono">
              <div class="space-y-1.5">
                <select id="${toolId}_unitA" class="w-full bg-workspace-bg border border-workspace-border rounded p-1 text-[11px] text-workspace-text focus:outline-none"></select>
                <input id="${toolId}_inputA" type="number" step="any" value="1" class="w-full bg-workspace-bg border border-workspace-border rounded p-2 text-xs text-workspace-text focus:border-workspace-accent focus:outline-none" />
              </div>
              <button id="${toolId}_btnSwap" type="button" title="Swap Units" class="p-1.5 mt-5 rounded bg-workspace-bg hover:bg-workspace-surfaceHover border border-workspace-border text-workspace-muted hover:text-workspace-accent transition-colors">
                ⇄
              </button>
              <div class="space-y-1.5">
                <select id="${toolId}_unitB" class="w-full bg-workspace-bg border border-workspace-border rounded p-1 text-[11px] text-workspace-text focus:outline-none"></select>
                <input id="${toolId}_inputB" type="number" step="any" class="w-full bg-workspace-bg border border-workspace-border rounded p-2 text-xs text-workspace-accent font-bold focus:border-workspace-accent focus:outline-none" />
              </div>
            </div>
            <div id="${toolId}_formula" class="text-[11px] font-mono text-center text-workspace-muted pt-2 border-t border-workspace-border/50"></div>
          </div>
        `,
        init: (toolId) => {
          const categorySelect = document.getElementById(`${toolId}_category`);
          const precisionSelect = document.getElementById(`${toolId}_precision`);
          const unitA = document.getElementById(`${toolId}_unitA`);
          const unitB = document.getElementById(`${toolId}_unitB`);
          const inputA = document.getElementById(`${toolId}_inputA`);
          const inputB = document.getElementById(`${toolId}_inputB`);
          const btnSwap = document.getElementById(`${toolId}_btnSwap`);
          const formula = document.getElementById(`${toolId}_formula`);

          function populateUnitOptions() {
            const catKey = categorySelect.value;
            const config = CONVERTER_CONFIG[catKey];
            const entries = Object.entries(config.units);
            const optionsHtml = entries.map(([key, u]) => `<option value="${key}">${u.label}</option>`).join('');
            unitA.innerHTML = optionsHtml;
            unitB.innerHTML = optionsHtml;
            unitA.value = config.defaultA;
            unitB.value = config.defaultB;
          }

          function convertValue(val, fromKey, toKey, catKey) {
            if (isNaN(val) || val === '') return '';
            val = parseFloat(val);

            if (catKey === 'temp') {
              let celsius = val;
              if (fromKey === 'f') celsius = (val - 32) * (5 / 9);
              else if (fromKey === 'k') celsius = val - 273.15;
              if (toKey === 'c') return celsius;
              if (toKey === 'f') return (celsius * (9 / 5)) + 32;
              if (toKey === 'k') return celsius + 273.15;
              return celsius;
            }

            const config = CONVERTER_CONFIG[catKey];
            const fromRatio = config.units[fromKey].ratio;
            const toRatio = config.units[toKey].ratio;
            return (val * fromRatio) / toRatio;
          }

          function formatNumber(num) {
            if (num === '' || isNaN(num)) return '';
            const dec = parseInt(precisionSelect.value, 10);
            return parseFloat(num.toFixed(dec)).toString();
          }

          function calculateFromA() {
            const catKey = categorySelect.value;
            if (inputA.value === '') { inputB.value = ''; return; }
            const res = convertValue(inputA.value, unitA.value, unitB.value, catKey);
            inputB.value = formatNumber(res);
            updateFormulaBar();
          }

          function calculateFromB() {
            const catKey = categorySelect.value;
            if (inputB.value === '') { inputA.value = ''; return; }
            const res = convertValue(inputB.value, unitB.value, unitA.value, catKey);
            inputA.value = formatNumber(res);
            updateFormulaBar();
          }

          function updateFormulaBar() {
            const catKey = categorySelect.value;
            if (catKey === 'temp') {
              formula.textContent = `${unitA.value.toUpperCase()} ↔ ${unitB.value.toUpperCase()}`;
            } else {
              const oneConverted = convertValue(1, unitA.value, unitB.value, catKey);
              formula.textContent = `1 ${unitA.value} ≈ ${formatNumber(oneConverted)} ${unitB.value}`;
            }
          }

          categorySelect.addEventListener('change', () => { populateUnitOptions(); calculateFromA(); });
          precisionSelect.addEventListener('change', calculateFromA);
          unitA.addEventListener('change', calculateFromA);
          unitB.addEventListener('change', calculateFromA);
          inputA.addEventListener('input', calculateFromA);
          inputB.addEventListener('input', calculateFromB);
          btnSwap.addEventListener('click', () => {
            const temp = unitA.value;
            unitA.value = unitB.value;
            unitB.value = temp;
            calculateFromA();
          });

          populateUnitOptions();
          calculateFromA();
        }
      }
    };

    let activePinnedTools = JSON.parse(localStorage.getItem('tabkit_pinned_tools') || '[]');

      localStorage.setItem('tabkit_pinned_tools', JSON.stringify(activePinnedTools));
      renderWorkbench();
      updateStorageIndicator();
    }

    function pinTool(toolId) {
      if (!TOOLS_REGISTRY[toolId]) return;
      if (!activePinnedTools.includes(toolId)) {
        activePinnedTools.push(toolId);
        saveWorkspaceState();
      }
      closeCommandPalette();
    }

    function unpinTool(toolId) {
      activePinnedTools = activePinnedTools.filter(id => id !== toolId);
      saveWorkspaceState();
    }

    function renderWorkbench() {
      const grid = document.getElementById('workbenchGrid');
      const emptyState = document.getElementById('emptyWorkspaceState');

      grid.innerHTML = '';
      if (activePinnedTools.length === 0) {
        emptyState.classList.remove('hidden');
        return;

      emptyState.classList.add('hidden');

      activePinnedTools.forEach(toolId => {
        const tool = TOOLS_REGISTRY[toolId];

        card.className = 'rounded-xl border border-workspace-border bg-workspace-surface p-4 flex flex-col justify-between shadow-lg relative group';

                <line x1="18" y1="6" x2="6" y2="18"></line>

          <div class="flex-1">

        grid.appendChild(card);

    function toggleScratchMode(toolId, mode) {

      const diffBox = document.getElementById(`${toolId}_diffContainer`);
      const tabNote = document.getElementById(`${toolId}_tabNote`);
      const tabDiff = document.getElementById(`${toolId}_tabDiff`);

        tabNote.className = 'px-2 py-0.5 rounded text-[11px] font-medium text-workspace-muted hover:text-workspace-text';

    function runTextDiff(toolId) {
      const textA = (document.getElementById(`${toolId}_diffA`).value || '').split('\n');
      const textB = (document.getElementById(`${toolId}_diffB`).value || '').split('\n');
      const output = document.getElementById(`${toolId}_diffOutput`);
      output.innerHTML = '';

      const max = Math.max(textA.length, textB.length);
      for (let i = 0; i < max; i++) {
        const lineA = textA[i] || '';
        const lineB = textB[i] || '';
        const lineDiv = document.createElement('div');
        if (lineA === lineB) {
          lineDiv.className = 'text-workspace-muted';
          lineDiv.textContent = `  ${lineA}`;
        } else {
          lineDiv.innerHTML = `
            <div class="text-rose-400 bg-rose-950/30 px-1 rounded">- ${escapeHtml(lineA)}</div>
            <div class="text-emerald-400 bg-emerald-950/30 px-1 rounded">+ ${escapeHtml(lineB)}</div>
          `;
        }
        output.appendChild(lineDiv);
      }
    }

    function cleanUrls(toolId) {
      const input = document.getElementById(`${toolId}_input`).value;
      const countEl = document.getElementById(`${toolId}_count`);
      const output = document.getElementById(`${toolId}_output`);
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const matches = input.match(urlRegex) || [];

      const cleaned = matches.map(rawUrl => {
        try {
          const parsed = new URL(rawUrl);
          const trackingPrefixes = ['utm_', 'fbclid', 'gclid', 'ref', 'source', 'mc_cid', 'mc_eid'];
          const keysToDelete = [];
          parsed.searchParams.forEach((_, key) => {
            if (trackingPrefixes.some(pref => key.toLowerCase().startsWith(pref))) {
              keysToDelete.push(key);
            }
          });
          keysToDelete.forEach(k => parsed.searchParams.delete(k));
          return parsed.toString();
        } catch (e) {
          return rawUrl;
        }
      });

      const unique = [...new Set(cleaned)];
      output.value = unique.join('\n');
      countEl.textContent = `${unique.length} links`;
    }

    function openAllCleanUrls(toolId) {
      const output = document.getElementById(`${toolId}_output`).value;
      const links = output.split('\n').map(l => l.trim()).filter(Boolean);
      if (!links.length) return alert('No cleaned links to open.');
      links.forEach(url => window.open(url, '_blank'));
    }

    function copyCleanUrls(toolId) {
      const output = document.getElementById(`${toolId}_output`);
      if (!output.value) return;
      navigator.clipboard.writeText(output.value);
      alert('Cleaned links copied to clipboard.');
    }

    function transformCase(toolId, type) {
      const input = document.getElementById(`${toolId}_input`);
      let val = input.value;
      if (type === 'upper') input.value = val.toUpperCase();
      else if (type === 'lower') input.value = val.toLowerCase();
      else if (type === 'title') input.value = val.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
      else if (type === 'dedupe') input.value = [...new Set(val.split('\n'))].join('\n');
      input.dispatchEvent(new Event('input'));
    }

    function copyTextTool(toolId) {
      const input = document.getElementById(`${toolId}_input`);
      navigator.clipboard.writeText(input.value);
      alert('Text copied to clipboard.');
    }

    function copyQrSource(toolId) {
      const input = document.getElementById(`${toolId}_input`);
      navigator.clipboard.writeText(input.value);
      alert('Content copied to clipboard.');
    }

    function downloadQrCode(toolId) {
      const container = document.getElementById(`${toolId}_canvas`);
      if (!container) return;
      const img = container.querySelector('img');
      const canvas = container.querySelector('canvas');
      let url = img && img.src ? img.src : (canvas ? canvas.toDataURL('image/png') : null);
      if (!url) return alert('No QR code generated yet.');
      const a = document.createElement('a');
      a.href = url;
      a.download = `tabkit-qr-${Date.now()}.png`;
      a.click();
    }

    let currentPwMode = 'pass';
    function setPwType(toolId, mode) {
      currentPwMode = mode;
      const tabPass = document.getElementById(`${toolId}_tabPass`);
      const tabPin = document.getElementById(`${toolId}_tabPin`);
      const slider = document.getElementById(`${toolId}_lenSlider`);
      const label = document.getElementById(`${toolId}_lenLabel`);

      if (mode === 'pass') {
        tabPass.className = 'flex-1 py-1 rounded bg-workspace-surface text-workspace-accent font-medium';
        tabPin.className = 'flex-1 py-1 rounded text-workspace-muted hover:text-workspace-text font-medium';
        slider.min = '8'; slider.max = '32'; slider.value = '16';
      } else {
        tabPin.className = 'flex-1 py-1 rounded bg-workspace-surface text-workspace-accent font-medium';
        tabPass.className = 'flex-1 py-1 rounded text-workspace-muted hover:text-workspace-text font-medium';
        slider.min = '4'; slider.max = '8'; slider.value = '6';
      }
      label.textContent = slider.value;
      generateNewPassword(toolId);
    }

    function generateNewPassword(toolId) {
      const output = document.getElementById(`${toolId}_output`);
      const slider = document.getElementById(`${toolId}_lenSlider`);
      if (!output || !slider) return;
      const len = parseInt(slider.value, 10);
      let chars = currentPwMode === 'pass' 
        ? 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?_' 
        : '0123456789';
      let res = '';
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < len; i++) res += chars[array[i] % chars.length];
      output.value = res;
    }

    function copyGeneratedPw(toolId) {
      const output = document.getElementById(`${toolId}_output`);
      navigator.clipboard.writeText(output.value);
      alert('Copied to clipboard.');
    }

    /**
     * WORKSPACE BACKUP & RESTORE
     */
    function exportWorkspaceBackup() {
      const backup = {
        version: 1,
        exportedAt: new Date().toISOString(),
        data: {}
      };
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('tabkit_')) {
          backup.data[key] = localStorage.getItem(key);
        }
      }
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `tabkit-backup-${d}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerImport() {
      document.getElementById('backupFileInput').click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.data || typeof parsed.data !== 'object') {
            throw new Error('Invalid backup file');
          }
          Object.entries(parsed.data).forEach(([k, v]) => {
            localStorage.setItem(k, v);
          });
          activePinnedTools = JSON.parse(localStorage.getItem('tabkit_pinned_tools') || '[]');
          renderWorkbench();
          updateStorageIndicator();
          alert('Workspace backup successfully restored!');
        } catch (err) {
          alert('Failed to import backup: invalid file format.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function updateStorageIndicator() {
      let totalBytes = 0;
      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          totalBytes += (localStorage[key].length + key.length) * 2;
        }
      }
      const kb = (totalBytes / 1024).toFixed(1);
      const badge = document.getElementById('storageUsageBadge');
      if (badge) badge.textContent = `Storage: ${kb} KB used`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const commandModal = document.getElementById('commandPaletteModal');
    const commandInput = document.getElementById('commandInput');
    const commandResults = document.getElementById('commandResultsList');

    function openCommandPalette() {
      commandModal.classList.remove('hidden');
      commandInput.value = '';
      renderCommandList();
      setTimeout(() => commandInput.focus(), 20);
    }

    function closeCommandPalette() {
      commandModal.classList.add('hidden');
    }

    function renderCommandList(query = '') {
      commandResults.innerHTML = '';
      const filtered = Object.values(TOOLS_REGISTRY).filter(t => 
        t.name.toLowerCase().includes(query.toLowerCase()) || 
        t.category.toLowerCase().includes(query.toLowerCase())
      );

      if (!filtered.length) {
        commandResults.innerHTML = `<div class="p-3 text-center text-xs text-workspace-muted font-mono">No matching tools found.</div>`;
        return;
      }

      filtered.forEach(tool => {
        const isPinned = activePinnedTools.includes(tool.id);
        const item = document.createElement('div');
        item.className = 'p-2.5 rounded-lg hover:bg-workspace-bg flex items-center justify-between cursor-pointer border border-transparent hover:border-workspace-border';
        item.onclick = () => isPinned ? unpinTool(tool.id) : pinTool(tool.id);

        item.innerHTML = `
          <div>
            <div class="text-xs font-semibold text-workspace-text">${tool.name}</div>
            <div class="text-[11px] text-workspace-muted">${tool.description}</div>
          </div>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded ${isPinned ? 'bg-rose-950/40 text-rose-400 border border-rose-900/50' : 'bg-workspace-accent/10 text-workspace-accent border border-workspace-accent/20'}">
            ${isPinned ? 'Unpin' : 'Pin to Board'}
          </span>
        `;
        commandResults.appendChild(item);
      });
    }

    commandInput.addEventListener('input', (e) => renderCommandList(e.target.value));

    document.addEventListener('keydown', (e) => {
      const isCmdOrCtrl = e.ctrlKey || e.metaKey;
      const isKeyK = e.code === 'KeyK' || (e.key && e.key.toLowerCase() === 'k');
      if (isCmdOrCtrl && isKeyK) {
        e.preventDefault();
        openCommandPalette();
      }
      if (e.key === 'Escape' && !commandModal.classList.contains('hidden')) {
        e.preventDefault();
        closeCommandPalette();
      }
    }, true);

    document.getElementById('btnOpenCommandPalette').addEventListener('click', openCommandPalette);
    document.getElementById('btnOpenToolCatalog').addEventListener('click', openCommandPalette);
    commandModal.addEventListener('click', (e) => {
      if (e.target === commandModal) closeCommandPalette();
    });

    document.getElementById('btnLoadStarterDeck').addEventListener('click', () => {
      activePinnedTools = ['scratchpad', 'qr-generator', 'timezone-buddy'];
      saveWorkspaceState();
    });

    document.getElementById('btnResetWorkspace').addEventListener('click', () => {
      if (confirm('Clear all tools from your active workbench?')) {
        activePinnedTools = [];
        saveWorkspaceState();
      }
    });

    renderWorkbench();
    updateStorageIndicator();
  </script>
</body>
</html>
