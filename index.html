<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabkit.tools — Privacy-first browser workbench</title>
  <meta name="description" content="Fast, private, zero-telemetry client-side utilities for daily work." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              burgundy: '#72142A',
              dark: '#4F0C1C',
              gold: '#D4A359',
              sand: '#FBF9F6',
              surface: '#FFFFFF',
              espresso: '#1A1818',
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-full bg-[#0F1117] text-slate-100 flex flex-col selection:bg-brand-gold selection:text-black">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-[#161922] sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-brand-burgundy to-brand-gold flex items-center justify-center font-display font-bold text-white shadow-md">
          tk
        </div>
        <span class="font-display font-bold text-lg tracking-tight text-white">tabkit<span class="text-brand-gold">.tools</span></span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">100% Client-Side</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="cmd-k-trigger" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 text-slate-400 hover:text-slate-200 text-xs transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span>Find utility...</span>
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-slate-900 border border-slate-700 rounded text-slate-300">⌘K</kbd>
        </button>
        <button id="add-tool-header-btn" class="px-3 py-1.5 rounded-lg bg-brand-burgundy hover:bg-[#861932] text-white text-xs font-semibold shadow-sm transition-all flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Add Tool</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-24 md:pb-12">
    <!-- Active Tools Grid Container -->
    <div id="workbench-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-20 border-2 border-dashed border-slate-800 rounded-2xl p-8 max-w-xl mx-auto my-12">
      <div class="w-12 h-12 rounded-xl bg-slate-800/80 text-brand-gold flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      </div>
      <h3 class="text-lg font-semibold text-white font-display mb-1">Your workbench is empty</h3>
      <p class="text-sm text-slate-400 mb-6">Select utilities to pin to your active workspace. Everything runs locally in memory.</p>
      <button onclick="openCommandPalette()" class="px-4 py-2 bg-brand-burgundy hover:bg-[#861932] text-white rounded-lg text-sm font-semibold transition-all shadow-md">
        Browse All Tools
      </button>
    </div>
  </main>

  <!-- Command Palette Modal -->
  <div id="command-palette-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-20 px-4">
    <div class="bg-[#161922] border border-slate-800 w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col">
      <div class="p-3 border-b border-slate-800 flex items-center gap-2">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="palette-search" type="text" placeholder="Search tool by name or keyword..." class="w-full bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none" autofocus />
        <kbd class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">ESC</kbd>
      </div>
      <div id="palette-list" class="max-h-80 overflow-y-auto p-2 space-y-1"></div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-700 text-slate-100 text-xs px-4 py-2 rounded-lg shadow-xl translate-y-12 opacity-0 transition-all pointer-events-none z-50"></div>

  <!-- Tools Script Core & Registry -->
  <script>
    // Country + City Lookup Map for Time Zone Buddy
    const COUNTRY_ZONE_MAP = [
      { country: "Qatar", code: "QA", label: "Doha (AST)", iana: "Asia/Qatar" },
      { country: "Tunisia", code: "TN", label: "Tunis (CET)", iana: "Africa/Tunis" },
      { country: "United Arab Emirates", code: "AE", label: "Dubai (GST)", iana: "Asia/Dubai" },
      { country: "Saudi Arabia", code: "SA", label: "Riyadh (AST)", iana: "Asia/Riyadh" },
      { country: "Egypt", code: "EG", label: "Cairo (EET)", iana: "Africa/Cairo" },
      { country: "United Kingdom", code: "GB", label: "London (GMT/BST)", iana: "Europe/London" },
      { country: "France", code: "FR", label: "Paris (CET/CEST)", iana: "Europe/Paris" },
      { country: "Germany", code: "DE", label: "Berlin (CET/CEST)", iana: "Europe/Berlin" },
      { country: "Japan", code: "JP", label: "Tokyo (JST)", iana: "Asia/Tokyo" },
      { country: "Singapore", code: "SG", label: "Singapore (SGT)", iana: "Asia/Singapore" },
      { country: "India", code: "IN", label: "New Delhi (IST)", iana: "Asia/Kolkata" },
      { country: "Turkey", code: "TR", label: "Istanbul (TRT)", iana: "Europe/Istanbul" },
      { country: "United States", code: "US", label: "New York (Eastern - EST/EDT)", iana: "America/New_York" },
      { country: "United States", code: "US", label: "Chicago (Central - CST/CDT)", iana: "America/Chicago" },
      { country: "United States", code: "US", label: "Denver (Mountain - MST/MDT)", iana: "America/Denver" },
      { country: "United States", code: "US", label: "Los Angeles (Pacific - PST/PDT)", iana: "America/Los_Angeles" },
      { country: "Canada", code: "CA", label: "Toronto (Eastern)", iana: "America/Toronto" },
      { country: "Canada", code: "CA", label: "Vancouver (Pacific)", iana: "America/Vancouver" },
      { country: "Australia", code: "AU", label: "Sydney (AEST/AEDT)", iana: "Australia/Sydney" },
      { country: "Australia", code: "AU", label: "Perth (AWST)", iana: "Australia/Perth" },
      { country: "UTC", code: "UTC", label: "Universal Time (UTC / GMT)", iana: "UTC" }
    ];

    // Notification Helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('translate-y-12', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-12', 'opacity-0'), 2200);
    }

    // 7 Core Registry Plugins
    const TOOLS_REGISTRY = {
      'timezone-buddy': {
        name: 'Time Zone Buddy',
        description: 'Multi-zone time coordinator searchable by country, capital city, or IANA zone.',
        tags: ['time', 'timezone', 'country', 'meeting', 'world clock'],
        defaultPinned: true,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <div class="relative">
              <input id="${containerId}-zone-search" type="text" placeholder="Search by Country (e.g. Qatar, US, Tunisia) or City..." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-gold" />
              <div id="${containerId}-search-dropdown" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-lg max-h-48 overflow-y-auto hidden z-20 shadow-2xl p-1 text-xs"></div>
            </div>

            <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
              <span class="text-xs text-slate-400 font-medium">Reference Hour:</span>
              <input id="${containerId}-hour-slider" type="range" min="0" max="23" step="1" class="flex-1 accent-[#D4A359] cursor-pointer" />
              <span id="${containerId}-ref-hour-label" class="text-xs font-mono font-bold text-brand-gold w-14 text-right"></span>
            </div>

            <div id="${containerId}-zones-list" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
          </div>
        `,
        init: (containerId) => {
          let pinnedZones = JSON.parse(localStorage.getItem('tabkit_tz_pinned') || '["Asia/Qatar", "Africa/Tunis", "UTC", "America/New_York"]');
          let currentUtcHour = new Date().getUTCHours();

          const slider = document.getElementById(`${containerId}-hour-slider`);
          const label = document.getElementById(`${containerId}-ref-hour-label`);
          const list = document.getElementById(`${containerId}-zones-list`);
          const searchInput = document.getElementById(`${containerId}-zone-search`);
          const dropdown = document.getElementById(`${containerId}-search-dropdown`);

          slider.value = currentUtcHour;
          label.textContent = `${String(currentUtcHour).padStart(2, '0')}:00 UTC`;

          function formatZoneTime(iana, baseUtcHour) {
            try {
              const now = new Date();
              const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), baseUtcHour, 0, 0));
              const timeStr = d.toLocaleTimeString('en-US', { timeZone: iana, hour: '2-digit', minute: '2-digit', hour12: false });
              const hourNum = parseInt(timeStr.split(':')[0], 10);
              const isWorkingHours = hourNum >= 9 && hourNum <= 18;
              return { timeStr, isWorkingHours, hourNum };
            } catch(e) {
              return { timeStr: '--:--', isWorkingHours: false, hourNum: 0 };
            }
          }

          function renderZones() {
            list.innerHTML = pinnedZones.map(iana => {
              const meta = COUNTRY_ZONE_MAP.find(m => m.iana === iana) || { country: iana.split('/')[0], label: iana.split('/')[1] || iana };
              const { timeStr, isWorkingHours } = formatZoneTime(iana, parseInt(slider.value, 10));
              return `
                <div class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-xs">
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-semibold text-slate-100">${meta.country}</span>
                      <span class="text-slate-400 text-[11px]">— ${meta.label}</span>
                    </div>
                    <span class="text-[10px] font-mono text-slate-400">${iana}</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="font-mono text-sm font-bold ${isWorkingHours ? 'text-emerald-400' : 'text-slate-400'}">${timeStr}</span>
                    <button data-remove="${iana}" class="text-slate-400 hover:text-rose-400 p-1">×</button>
                  </div>
                </div>
              `;
            }).join('');

            list.querySelectorAll('[data-remove]').forEach(btn => {
              btn.onclick = () => {
                pinnedZones = pinnedZones.filter(z => z !== btn.dataset.remove);
                localStorage.setItem('tabkit_tz_pinned', JSON.stringify(pinnedZones));
                renderZones();
              };
            });
          }

          slider.oninput = () => {
            label.textContent = `${String(slider.value).padStart(2, '0')}:00 UTC`;
            renderZones();
          };

          searchInput.oninput = () => {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
              dropdown.classList.add('hidden');
              return;
            }
            const filtered = COUNTRY_ZONE_MAP.filter(item =>
              item.country.toLowerCase().includes(query) ||
              item.label.toLowerCase().includes(query) ||
              item.code.toLowerCase().includes(query) ||
              item.iana.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
              dropdown.innerHTML = `<div class="p-2 text-slate-400">No matching country or timezone found</div>`;
            } else {
              dropdown.innerHTML = filtered.map(item => `
                <div data-iana="${item.iana}" class="p-2 hover:bg-slate-800 rounded cursor-pointer flex justify-between items-center">
                  <div>
                    <span class="font-semibold text-slate-200">${item.country}</span>
                    <span class="text-slate-400 text-[11px]"> (${item.label})</span>
                  </div>
                  <span class="text-[10px] text-brand-gold font-mono">${item.code}</span>
                </div>
              `).join('');

              dropdown.querySelectorAll('[data-iana]').forEach(item => {
                item.onclick = () => {
                  const targetIana = item.dataset.iana;
                  if (!pinnedZones.includes(targetIana)) {
                    pinnedZones.push(targetIana);
                    localStorage.setItem('tabkit_tz_pinned', JSON.stringify(pinnedZones));
                    renderZones();
                  }
                  searchInput.value = '';
                  dropdown.classList.add('hidden');
                };
              });
            }
            dropdown.classList.remove('hidden');
          };

          document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
              dropdown.classList.add('hidden');
            }
          });

          renderZones();
        }
      },

      'scratchpad-diff': {
        name: 'Scratchpad & Diff',
        description: 'Auto-saving markdown scratchpad with two-text visual comparison.',
        tags: ['notes', 'scratchpad', 'diff', 'compare'],
        defaultPinned: true,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <div class="flex gap-2 text-xs">
              <button id="${containerId}-tab-pad" class="px-2.5 py-1 bg-slate-800 text-brand-gold font-semibold rounded">Scratchpad</button>
              <button id="${containerId}-tab-diff" class="px-2.5 py-1 bg-slate-900 text-slate-400 hover:text-slate-200 rounded">Diff Checker</button>
            </div>
            <div id="${containerId}-pad-view" class="flex flex-col gap-2">
              <textarea id="${containerId}-pad-area" rows="6" placeholder="Type or paste notes here (saved automatically in browser storage)..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-brand-gold resize-y"></textarea>
            </div>
            <div id="${containerId}-diff-view" class="hidden flex flex-col gap-2">
              <div class="grid grid-cols-2 gap-2">
                <textarea id="${containerId}-diff-a" rows="4" placeholder="Original text..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-mono focus:outline-none"></textarea>
                <textarea id="${containerId}-diff-b" rows="4" placeholder="Modified text..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-mono focus:outline-none"></textarea>
              </div>
              <button id="${containerId}-diff-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs font-semibold">Compute Line Diff</button>
              <div id="${containerId}-diff-out" class="p-2.5 bg-slate-900 border border-slate-800 rounded font-mono text-[11px] max-h-36 overflow-y-auto whitespace-pre-wrap"></div>
            </div>
          </div>
        `,
        init: (containerId) => {
          const area = document.getElementById(`${containerId}-pad-area`);
          area.value = localStorage.getItem('tabkit_scratchpad') || '';
          area.oninput = () => localStorage.setItem('tabkit_scratchpad', area.value);

          const tabPad = document.getElementById(`${containerId}-tab-pad`);
          const tabDiff = document.getElementById(`${containerId}-tab-diff`);
          const padView = document.getElementById(`${containerId}-pad-view`);
          const diffView = document.getElementById(`${containerId}-diff-view`);

          tabPad.onclick = () => {
            tabPad.className = "px-2.5 py-1 bg-slate-800 text-brand-gold font-semibold rounded";
            tabDiff.className = "px-2.5 py-1 bg-slate-900 text-slate-400 hover:text-slate-200 rounded";
            padView.classList.remove('hidden');
            diffView.classList.add('hidden');
          };
          tabDiff.onclick = () => {
            tabDiff.className = "px-2.5 py-1 bg-slate-800 text-brand-gold font-semibold rounded";
            tabPad.className = "px-2.5 py-1 bg-slate-900 text-slate-400 hover:text-slate-200 rounded";
            diffView.classList.remove('hidden');
            padView.classList.add('hidden');
          };

          const diffBtn = document.getElementById(`${containerId}-diff-btn`);
          const diffA = document.getElementById(`${containerId}-diff-a`);
          const diffB = document.getElementById(`${containerId}-diff-b`);
          const diffOut = document.getElementById(`${containerId}-diff-out`);

          diffBtn.onclick = () => {
            const linesA = diffA.value.split('\n');
            const linesB = diffB.value.split('\n');
            let res = '';
            const max = Math.max(linesA.length, linesB.length);
            for (let i = 0; i < max; i++) {
              const a = linesA[i];
              const b = linesB[i];
              if (a === b) {
                res += `<span class="text-slate-400">  ${a ?? ''}</span>\n`;
              } else {
                if (a !== undefined) res += `<span class="text-rose-400 bg-rose-500/10">- ${a}</span>\n`;
                if (b !== undefined) res += `<span class="text-emerald-400 bg-emerald-500/10">+ ${b}</span>\n`;
              }
            }
            diffOut.innerHTML = res || '<span class="text-slate-400">Both texts are identical.</span>';
          };
        }
      },

      'url-cleaner': {
        name: 'Bulk URL Cleaner',
        description: 'Strip tracking parameters (utm, fbclid, gclid, ref, affiliate tokens) in bulk.',
        tags: ['url', 'privacy', 'cleaner', 'utm', 'strip'],
        defaultPinned: true,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <textarea id="${containerId}-input" rows="4" placeholder="Paste dirty URLs (one per line)..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-brand-gold"></textarea>
            <div class="flex items-center justify-between">
              <button id="${containerId}-clean-btn" class="px-3 py-1.5 bg-brand-burgundy hover:bg-[#861932] text-white rounded text-xs font-semibold">Clean URLs</button>
              <button id="${containerId}-copy-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">Copy Cleaned</button>
            </div>
            <textarea id="${containerId}-output" rows="4" readonly placeholder="Clean URLs appear here..." class="w-full bg-slate-900/60 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-emerald-400 focus:outline-none"></textarea>
          </div>
        `,
        init: (containerId) => {
          const input = document.getElementById(`${containerId}-input`);
          const output = document.getElementById(`${containerId}-output`);
          const cleanBtn = document.getElementById(`${containerId}-clean-btn`);
          const copyBtn = document.getElementById(`${containerId}-copy-btn`);

          const trackingKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'fbclid', 'gclid', 'msclkid', 'mc_cid', 'mc_eid', '_hsenc', '_hsmi', 'ref', 'ref_src'];

          cleanBtn.onclick = () => {
            const lines = input.value.split('\n');
            const cleaned = lines.map(line => {
              line = line.trim();
              if (!line) return '';
              try {
                const u = new URL(line);
                trackingKeys.forEach(key => u.searchParams.delete(key));
                // Remove generic utm_* wildcards
                Array.from(u.searchParams.keys()).forEach(k => {
                  if (k.startsWith('utm_')) u.searchParams.delete(k);
                });
                return u.toString();
              } catch(e) {
                return line;
              }
            }).filter(Boolean);
            output.value = cleaned.join('\n');
          };

          copyBtn.onclick = () => {
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            showToast('Cleaned URLs copied to clipboard');
          };
        }
      },

      'qr-handoff': {
        name: 'Instant QR Handoff',
        description: 'Generate high-density QR codes for links, text, and instant mobile transfer.',
        tags: ['qr', 'generator', 'mobile', 'handoff'],
        defaultPinned: true,
        render: (containerId) => `
          <div class="flex flex-col sm:flex-row gap-4 items-center">
            <div class="flex-1 w-full flex flex-col gap-2.5">
              <input id="${containerId}-text" type="text" placeholder="https:// or paste any string..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-brand-gold" />
              <button id="${containerId}-gen-btn" class="px-3 py-1.5 bg-brand-burgundy hover:bg-[#861932] text-white rounded text-xs font-semibold">Generate QR</button>
            </div>
            <div id="${containerId}-qrcode" class="p-2 bg-white rounded-lg flex items-center justify-center min-w-[128px] min-h-[128px]"></div>
          </div>
        `,
        init: (containerId) => {
          const textInput = document.getElementById(`${containerId}-text`);
          const genBtn = document.getElementById(`${containerId}-gen-btn`);
          const qrContainer = document.getElementById(`${containerId}-qrcode`);

          let qrcode = new QRCode(qrContainer, {
            text: "https://tabkit.tools",
            width: 120,
            height: 120,
            colorDark: "#1A1818",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.M
          });

          genBtn.onclick = () => {
            const val = textInput.value.trim() || 'https://tabkit.tools';
            qrContainer.innerHTML = '';
            qrcode = new QRCode(qrContainer, {
              text: val,
              width: 120,
              height: 120,
              colorDark: "#1A1818",
              colorLight: "#FFFFFF",
              correctLevel: QRCode.CorrectLevel.M
            });
          };
        }
      },

      'text-formatter': {
        name: 'Text & Case Formatter',
        description: 'Switch between camelCase, snake_case, kebab-case, title case, and trim whitespace.',
        tags: ['text', 'case', 'formatter', 'camel', 'snake', 'slug'],
        defaultPinned: false,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <textarea id="${containerId}-text" rows="4" placeholder="Paste text to format..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-gold font-mono"></textarea>
            <div class="flex flex-wrap gap-1.5">
              <button data-action="upper" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">UPPER</button>
              <button data-action="lower" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">lower</button>
              <button data-action="title" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">Title Case</button>
              <button data-action="camel" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">camelCase</button>
              <button data-action="snake" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">snake_case</button>
              <button data-action="kebab" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">kebab-case</button>
              <button data-action="trim" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded">Trim Lines</button>
            </div>
          </div>
        `,
        init: (containerId) => {
          const area = document.getElementById(`${containerId}-text`);
          const btns = document.querySelectorAll(`#${containerId} [data-action]`);

          btns.forEach(btn => {
            btn.onclick = () => {
              const act = btn.dataset.action;
              let txt = area.value;
              if (act === 'upper') area.value = txt.toUpperCase();
              if (act === 'lower') area.value = txt.toLowerCase();
              if (act === 'title') area.value = txt.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
              if (act === 'camel') area.value = txt.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
              if (act === 'snake') area.value = txt.match(/[A-Z]{2,}(?=[A-Z][a-z]+[0-9]*|\b)|[A-Z]?[a-z]+[0-9]*|[A-Z]|[0-9]+/g)?.map(x => x.toLowerCase()).join('_') || txt;
              if (act === 'kebab') area.value = txt.match(/[A-Z]{2,}(?=[A-Z][a-z]+[0-9]*|\b)|[A-Z]?[a-z]+[0-9]*|[A-Z]|[0-9]+/g)?.map(x => x.toLowerCase()).join('-') || txt;
              if (act === 'trim') area.value = txt.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
            };
          });
        }
      },

      'password-gen': {
        name: 'Password & PIN Generator',
        description: 'Cryptographically secure passwords, random PINs, and passphrase generator.',
        tags: ['password', 'pin', 'crypto', 'security', 'generator'],
        defaultPinned: false,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <div class="flex items-center gap-2">
              <input id="${containerId}-display" type="text" readonly class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono text-brand-gold select-all font-bold" />
              <button id="${containerId}-copy" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded text-white font-semibold">Copy</button>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-300">
              <label class="flex items-center gap-1.5"><input type="range" id="${containerId}-len" min="6" max="64" value="16" class="accent-[#D4A359]" /> <span id="${containerId}-len-label" class="font-mono">16 chars</span></label>
              <label class="flex items-center gap-1"><input type="checkbox" id="${containerId}-sym" checked class="rounded" /> Symbols</label>
              <label class="flex items-center gap-1"><input type="checkbox" id="${containerId}-num" checked class="rounded" /> Numbers</label>
            </div>
            <div class="flex gap-2">
              <button id="${containerId}-gen-pwd" class="flex-1 py-1.5 bg-brand-burgundy hover:bg-[#861932] text-white rounded text-xs font-semibold">Generate Password</button>
              <button id="${containerId}-gen-pin" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs">6-Digit PIN</button>
            </div>
          </div>
        `,
        init: (containerId) => {
          const display = document.getElementById(`${containerId}-display`);
          const copyBtn = document.getElementById(`${containerId}-copy`);
          const lenSlider = document.getElementById(`${containerId}-len`);
          const lenLabel = document.getElementById(`${containerId}-len-label`);
          const symCheck = document.getElementById(`${containerId}-sym`);
          const numCheck = document.getElementById(`${containerId}-num`);
          const genPwdBtn = document.getElementById(`${containerId}-gen-pwd`);
          const genPinBtn = document.getElementById(`${containerId}-gen-pin`);

          function getRandomString(len, chars) {
            const arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            return Array.from(arr).map(x => chars[x % chars.length]).join('');
          }

          function generate() {
            let chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (numCheck.checked) chars += '0123456789';
            if (symCheck.checked) chars += '!@#$%^&*()-_=+[]{}|;:,.<>?';
            display.value = getRandomString(parseInt(lenSlider.value, 10), chars);
          }

          lenSlider.oninput = () => {
            lenLabel.textContent = `${lenSlider.value} chars`;
            generate();
          };

          genPwdBtn.onclick = generate;
          genPinBtn.onclick = () => {
            display.value = getRandomString(6, '0123456789');
          };
          copyBtn.onclick = () => {
            if (!display.value) return;
            navigator.clipboard.writeText(display.value);
            showToast('Password copied');
          };

          generate();
        }
      },

      'unit-converter': {
        name: 'Everyday Unit Converter',
        description: 'Instant client-side conversions for data storage, length, temperature, and weight.',
        tags: ['unit', 'converter', 'storage', 'temperature', 'metric'],
        defaultPinned: false,
        render: (containerId) => `
          <div class="flex flex-col gap-3">
            <div class="grid grid-cols-2 gap-2 text-xs">
              <select id="${containerId}-category" class="bg-slate-900 border border-slate-800 rounded p-2 text-slate-200">
                <option value="data">Digital Storage (MB / GB / TB)</option>
                <option value="temp">Temperature (°C / °F)</option>
                <option value="weight">Weight (kg / lbs)</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2 items-center">
              <div class="flex flex-col gap-1">
                <input id="${containerId}-val1" type="number" value="1" class="bg-slate-900 border border-slate-800 rounded p-2 text-xs font-mono text-slate-100" />
                <span id="${containerId}-u1-label" class="text-[11px] text-slate-400">GB</span>
              </div>
              <div class="flex flex-col gap-1">
                <input id="${containerId}-val2" type="number" readonly class="bg-slate-900/60 border border-slate-800 rounded p-2 text-xs font-mono text-brand-gold font-bold" />
                <span id="${containerId}-u2-label" class="text-[11px] text-slate-400">MB</span>
              </div>
            </div>
          </div>
        `,
        init: (containerId) => {
          const cat = document.getElementById(`${containerId}-category`);
          const v1 = document.getElementById(`${containerId}-val1`);
          const v2 = document.getElementById(`${containerId}-val2`);
          const l1 = document.getElementById(`${containerId}-u1-label`);
          const l2 = document.getElementById(`${containerId}-u2-label`);

          function compute() {
            const val = parseFloat(v1.value) || 0;
            if (cat.value === 'data') {
              l1.textContent = 'Gigabytes (GB)';
              l2.textContent = 'Megabytes (MB)';
              v2.value = (val * 1024).toLocaleString();
            } else if (cat.value === 'temp') {
              l1.textContent = 'Celsius (°C)';
              l2.textContent = 'Fahrenheit (°F)';
              v2.value = ((val * 9/5) + 32).toFixed(2);
            } else if (cat.value === 'weight') {
              l1.textContent = 'Kilograms (kg)';
              l2.textContent = 'Pounds (lbs)';
              v2.value = (val * 2.20462).toFixed(2);
            }
          }

          cat.onchange = compute;
          v1.oninput = compute;
          compute();
        }
      }
    };

    // Workbench Grid Manager
    let activePinned = JSON.parse(localStorage.getItem('tabkit_active_tools') || '["timezone-buddy", "scratchpad-diff", "url-cleaner", "qr-handoff"]');

    function saveActiveTools() {
      localStorage.setItem('tabkit_active_tools', JSON.stringify(activePinned));
      renderWorkbench();
    }

    function removeTool(key) {
      activePinned = activePinned.filter(k => k !== key);
      saveActiveTools();
    }

    function addTool(key) {
      if (!activePinned.includes(key)) {
        activePinned.push(key);
        saveActiveTools();
      }
      closeCommandPalette();
    }

    function renderWorkbench() {
      const grid = document.getElementById('workbench-grid');
      const empty = document.getElementById('empty-state');

      if (activePinned.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = activePinned.map(key => {
        const tool = TOOLS_REGISTRY[key];
        if (!tool) return '';
        const cid = `tool-c-${key}`;
        return `
          <div class="bg-[#161922] border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                <div>
                  <h3 class="font-display font-semibold text-sm text-white">${tool.name}</h3>
                  <p class="text-[11px] text-slate-400">${tool.description}</p>
                </div>
                <button onclick="removeTool('${key}')" title="Unpin tool" class="text-slate-400 hover:text-rose-400 p-1 rounded transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div id="${cid}">
                ${tool.render(cid)}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Initialize scripts for all active tools
      activePinned.forEach(key => {
        const tool = TOOLS_REGISTRY[key];
        if (tool && tool.init) {
          tool.init(`tool-c-${key}`);
        }
      });
    }

    // Command Palette Logic
    const paletteBackdrop = document.getElementById('command-palette-backdrop');
    const paletteSearch = document.getElementById('palette-search');
    const paletteList = document.getElementById('palette-list');

    function openCommandPalette() {
      paletteBackdrop.classList.remove('hidden');
      paletteSearch.value = '';
      renderPaletteItems();
      paletteSearch.focus();
    }

    function closeCommandPalette() {
      paletteBackdrop.classList.add('hidden');
    }

    function renderPaletteItems() {
      const q = paletteSearch.value.toLowerCase().trim();
      const keys = Object.keys(TOOLS_REGISTRY);
      const filtered = keys.filter(k => {
        const t = TOOLS_REGISTRY[k];
        return t.name.toLowerCase().includes(q) ||
               t.description.toLowerCase().includes(q) ||
               t.tags.some(tag => tag.toLowerCase().includes(q));
      });

      paletteList.innerHTML = filtered.map(k => {
        const t = TOOLS_REGISTRY[k];
        const isPinned = activePinned.includes(k);
        return `
          <div onclick="addTool('${k}')" class="flex items-center justify-between p-2.5 hover:bg-slate-800 rounded-lg cursor-pointer transition-colors">
            <div>
              <div class="text-xs font-semibold text-slate-100">${t.name}</div>
              <div class="text-[11px] text-slate-400">${t.description}</div>
            </div>
            ${isPinned ? '<span class="text-[10px] text-brand-gold bg-brand-gold/10 px-2 py-0.5 rounded border border-brand-gold/20 font-medium">Pinned</span>' : '<span class="text-[10px] text-slate-400 bg-slate-900 px-2 py-0.5 rounded">Pin</span>'}
          </div>
        `;
      }).join('');
    }

    paletteSearch.oninput = renderPaletteItems;

    document.getElementById('cmd-k-trigger').onclick = openCommandPalette;
    document.getElementById('add-tool-header-btn').onclick = openCommandPalette;

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openCommandPalette();
      }
      if (e.key === 'Escape' && !paletteBackdrop.classList.contains('hidden')) {
        closeCommandPalette();
      }
    });

    paletteBackdrop.onclick = (e) => {
      if (e.target === paletteBackdrop) closeCommandPalette();
    };

    // Initial render
    renderWorkbench();
  </script>
</body>
