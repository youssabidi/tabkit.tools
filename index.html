<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabKit Tools — Modern Browser Utilities & Productivity Suite</title>
  <meta name="description" content="A curated suite of lightning-fast, privacy-first web utilities and browser productivity tools. Launching soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38BDF8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818CF8;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
      z-index: 10;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      border-radius: 18px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .logo-mark svg {
      width: 32px;
      height: 32px;
      stroke: var(--primary);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
      text-align: left;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .tool-list {
        grid-template-columns: 1fr;
      }
    }

    .tool-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
    }

    .tool-pill svg {
      width: 16px;
      height: 16px;
      stroke: var(--primary);
      flex-shrink: 0;
    }

    footer {
      font-size: 13px;
      color: #64748B;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Development in Progress</span>
    </div>

    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18"/>
        <path d="M9 21V9"/>
      </svg>
    </div>

    <h1>tabkit.tools</h1>
    <p class="subtitle">A lightweight, private toolkit built for tab hoarders, developers, and power users. No trackers, no bloat.</p>

    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Planned Core Utilities
      </div>
      <div class="tool-list">
        <div class="tool-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
          Tab Group Exporter
        </div>
        <div class="tool-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Clean URL Sanitizer
        </div>
        <div class="tool-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          JSON & Query Stash
        </div>
        <div class="tool-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/></svg>
          Workspace Snapshots
        </div>
      </div>
    </div>

    <footer>
      &copy; 2026 tabkit.tools. Hosted on Cloudflare Edge.
    </footer>
  </div>

</body>
</html>
