<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>tabkit.tools — Tab Management, Done Right.</title>
  <meta name="description" content="A razor-sharp, zero-bloat browser workspace. Coming soon." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0B0F19;
      --card: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: #38BDF8;
      --text-main: #FFFFFF;
      --text-muted: #9CA3AF;
      --primary: #38BDF8;
      --pill-bg: rgba(56, 189, 248, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 20px 24px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      text-decoration: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    main {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: auto 0;
      padding: 40px 0;
    }

    .tagline {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 6.5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    p.lead {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 36px;
      max-width: 480px;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 480px) {
      form {
        flex-direction: row;
      }
    }

    input[type="email"] {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #FFFFFF;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="email"]::placeholder {
      color: #6B7280;
    }

    input[type="email"]:focus {
      border-color: var(--border-accent);
    }

    button {
      background: var(--primary);
      color: #0B0F19;
      border: none;
      border-radius: 12px;
      padding: 14px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    #success-state {
      display: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      margin-top: 10px;
    }

    footer {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #6B7280;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">tabkit.tools</a>
    <div class="status-badge">
      <span class="status-dot"></span>
      In Development
    </div>
  </header>

  <main>
    <div class="tagline">Early Access</div>
    <h1>Tab management,<br />rethought.</h1>
    <p class="lead">
      Fast, quiet, and built for people who live in their browser. No noise, just clean tabs.
    </p>

    <form id="access-form" onsubmit="handleSignup(event)">
      <input 
        type="email" 
        id="email-field" 
        placeholder="Your email address" 
        required 
        autocomplete="email" 
      />
      <button type="submit">Join Waitlist</button>
    </form>

    <div id="success-state">✓ You're on the list. We'll be in touch.</div>
  </main>

  <footer>
    <span>&copy; 2026 tabkit.tools</span>
    <span>Cloudflare Edge</span>
  </footer>

  <script>
    function handleSignup(e) {
      e.preventDefault();
      const input = document.getElementById('email-field');
      const val = input.value.trim();
      if (!val) return;

      try {
        const stored = JSON.parse(localStorage.getItem('tabkit_waitlist') || '[]');
        if (!stored.includes(val)) {
          stored.push(val);
          localStorage.setItem('tabkit_waitlist', JSON.stringify(stored));
        }
      } catch (err) {}

      document.getElementById('access-form').style.display = 'none';
      document.getElementById('success-state').style.display = 'block';
    }
  </script>

</body>
</html>
