<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEX to RGB Color Converter | TabKit Tools</title>
  <link rel="manifest" href="/manifest.json" />
  
  <meta name="description" content="Convert colors instantly between HEX, RGB, and HSL formats. Features a visual color picker and offline processing." />
  <meta name="keywords" content="hex to rgb, rgb to hex, color converter online, hsl to rgb, hex color picker, offline color converter" />
  <link rel="canonical" href="https://tabkit.tools/hex-color-converter.html" />

  <meta property="og:title" content="HEX to RGB Color Converter | TabKit Tools" />
  <meta property="og:description" content="Instantly convert and preview web colors in HEX, RGB, and HSL formats." />
  <meta property="og:url" content="https://tabkit.tools/hex-color-converter.html" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HEX & RGB Color Converter",
    "url": "https://tabkit.tools/hex-color-converter.html",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Any",
    "description": "Convert HTML colors between HEX, RGB, and HSL values interactively."
  }
  </script>
  <script src="components.js"></script>
</head>

<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col selection:bg-workspace-accent selection:text-black">

  <tool-header tool-name="hex-color-converter"></tool-header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 md:py-12">
    <div class="mb-8 text-center max-w-2xl mx-auto">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-workspace-accent/10 border border-workspace-accent/30 text-workspace-accent text-xs font-mono mb-3">
        <span class="w-2 h-2 rounded-full bg-workspace-accent animate-pulse"></span>
        Designer Workflow Tool
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-3">HEX to RGB Color Converter</h1>
      <p class="text-sm text-workspace-muted leading-relaxed">
        Input a HEX code or use the color picker to instantly generate CSS-ready RGB and HSL syntax strings.
      </p>
    </div>

    <!-- The Tool -->
    <div class="rounded-2xl border border-workspace-border bg-workspace-surface shadow-2xl p-6 sm:p-8 mb-16 max-w-xl mx-auto">
      
      <!-- Primary Input -->
      <div class="flex items-center gap-4 p-4 bg-workspace-bg border border-workspace-border rounded-xl mb-6 shadow-inner">
        <div class="relative w-16 h-16 shrink-0">
          <input type="color" id="col_picker" value="#10B981" oninput="updateColor('picker')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
          <div id="col_preview" class="w-full h-full rounded-lg border-2 border-workspace-borderLight shadow" style="background-color: #10B981;"></div>
        </div>
        
        <div class="flex-1">
          <label class="block text-[11px] font-mono text-workspace-muted mb-1 uppercase tracking-wider">HEX Color Code</label>
          <input id="col_hex" type="text" value="#10B981" oninput="updateColor('hex')" class="w-full bg-workspace-surface border border-workspace-border rounded-lg p-2.5 text-lg font-mono text-workspace-text focus:border-workspace-accent focus:outline-none uppercase font-bold" />
        </div>
      </div>

      <!-- Output Array -->
      <div class="space-y-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-mono text-workspace-muted uppercase tracking-wider">RGB Format</span>
          </div>
          <div class="relative flex">
            <input id="col_rgb" readonly value="rgb(16, 185, 129)" class="w-full bg-workspace-bg border border-workspace-border rounded-l-lg p-3 text-sm font-mono text-workspace-accent focus:outline-none select-all" />
            <button onclick="copyColor('col_rgb')" class="px-4 bg-workspace-surface hover:bg-workspace-borderLight border-y border-r border-workspace-border text-xs font-bold font-sans text-workspace-text rounded-r-lg transition-all">Copy</button>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-mono text-workspace-muted uppercase tracking-wider">HSL Format</span>
          </div>
          <div class="relative flex">
            <input id="col_hsl" readonly value="hsl(160, 84%, 39%)" class="w-full bg-workspace-bg border border-workspace-border rounded-l-lg p-3 text-sm font-mono text-workspace-accent focus:outline-none select-all" />
            <button onclick="copyColor('col_hsl')" class="px-4 bg-workspace-surface hover:bg-workspace-borderLight border-y border-r border-workspace-border text-xs font-bold font-sans text-workspace-text rounded-r-lg transition-all">Copy</button>
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <tabkit-footer></tabkit-footer>

  <div id="toastContainer" class="fixed bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto px-4 py-2 rounded-lg bg-workspace-surface border border-workspace-border shadow-xl text-xs font-mono flex items-center gap-2 text-workspace-text transition-all duration-300 opacity-0 translate-y-2';
      toast.innerHTML = `<span class="text-workspace-accent">●</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2400);
    }

    function updateColor(source) {
      const hexInput = document.getElementById('col_hex');
      const rgbInput = document.getElementById('col_rgb');
      const hslInput = document.getElementById('col_hsl');
      const picker = document.getElementById('col_picker');
      const preview = document.getElementById('col_preview');
      
      let hex = source === 'picker' ? picker.value : hexInput.value;
      if (!hex.startsWith('#')) hex = '#' + hex;
      
      // Simple 6-char hex validation
      if (/^#[0-9A-F]{6}$/i.test(hex)) {
        if (source !== 'hex') hexInput.value = hex.toUpperCase();
        if (source !== 'picker') {
          picker.value = hex;
          preview.style.backgroundColor = hex;
        }
        
        // Convert to RGB
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        rgbInput.value = `rgb(${r}, ${g}, ${b})`;
        
        // Convert to HSL
        r /= 255; g /= 255; b /= 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        
        if (max === min) { 
          h = s = 0; 
        } else {
          let d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        hslInput.value = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
      }
    }

    function copyColor(targetId) {
      const val = document.getElementById(targetId).value;
      if (val) {
        navigator.clipboard.writeText(val);
        showToast('Color code copied!');
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
    }
  </script>
</body>
</html>
