<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON to Excel (.xlsx) Converter | TabKit Tools</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="description" content="Convert JSON arrays and objects directly into formatted Microsoft Excel (.xlsx) spreadsheets locally in your browser. 100% private, zero server uploads." />
  <link rel="canonical" href="https://tabkit.tools/json-to-excel" />
  <!-- OpenGraph SEO -->
  <meta property="og:title" content="JSON to Excel (.xlsx) Converter | TabKit Tools" />
  <meta property="og:description" content="Convert JSON arrays and objects directly into formatted Microsoft Excel (.xlsx) spreadsheets locally in your browser. 100% private, zero server uploads." />
  <meta property="og:url" content="https://tabkit.tools/json-to-excel" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="styles.css" />
  <script src="components.js"></script>
  <script src="utils.js"></script>
  <script src="registry.js"></script>
</head>
<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col selection:bg-workspace-accent selection:text-black">
  <tool-header tool-name="json-to-excel"></tool-header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 md:py-12">
    <div class="mb-8 text-center max-w-2xl mx-auto">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-workspace-accent/10 border border-workspace-accent/30 text-workspace-accent text-xs font-mono mb-3">
        <span class="w-2 h-2 rounded-full bg-workspace-accent animate-pulse"></span>
        100% Client-Side • API Data to Workbook
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-3">JSON to Excel Converter</h1>
      <p class="text-sm text-workspace-muted leading-relaxed">
        Convert arrays of JSON objects into structured Microsoft Excel workbooks (.xlsx) with auto-generated column headers and proper cell formatting.
      </p>
    </div>

    <div class="rounded-2xl border border-workspace-border bg-workspace-surface shadow-2xl p-6 mb-16 max-w-2xl mx-auto min-h-[460px] flex flex-col">
      <div id="tool-container" class="flex-1 w-full relative"></div>
    </div>
  </main>

  <tabkit-footer></tabkit-footer>
  <div id="toastContainer" class="fixed bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const tool = await loadTool('json-to-excel');
        const container = document.getElementById('tool-container');
        container.innerHTML = tool.render('json-to-excel');
        tool.init('json-to-excel');
      } catch (e) {
        console.error('Error loading tool:', e);
      }
    });
  </script>
</body>
</html>
