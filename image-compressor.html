<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client-Side Image Compressor & WebP | TabKit Tools</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="description" content="Compress PNG, JPEG, and WebP images locally inside your browser with zero server uploads." />
  <link rel="canonical" href="https://tabkit.tools/image-compressor" />
  <!-- OpenGraph SEO -->
  <meta property="og:title" content="Client-Side Image Compressor &amp; WebP | TabKit Tools" />
  <meta property="og:description" content="Compress PNG, JPEG, and WebP images locally inside your browser with zero server uploads." />
  <meta property="og:url" content="https://tabkit.tools/image-compressor" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="styles.css" />
  <script src="components.js"></script>
  <script src="utils.js"></script>
  <script src="registry.js"></script>
  <!-- Schema.org BreadcrumbList JSON-LD -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "@id": "https://tabkit.tools/image-compressor#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "TabKit",
          "item": "https://tabkit.tools/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Media & Design",
          "item": "https://tabkit.tools/#media-design"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Client-Side Image Compressor & WebP",
          "item": "https://tabkit.tools/image-compressor"
        }
      ]
    }
  ]
}
  </script>
</head>
<body class="bg-workspace-bg text-workspace-text font-sans antialiased min-h-screen flex flex-col selection:bg-workspace-accent selection:text-black">
  <tool-header tool-name="image-compressor"></tool-header>
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 md:py-12">
    <div class="mb-8 text-center max-w-2xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-3">Client-Side Image Compressor & WebP</h1>
      <p class="text-sm text-workspace-muted leading-relaxed">Compress PNG, JPEG, and WebP images locally inside your browser with zero server uploads.</p>
    </div>
    <!-- Increased height to comfortably fit file droppers and controls -->
    <div class="rounded-2xl border border-workspace-border bg-workspace-surface shadow-2xl p-6 mb-16 max-w-2xl mx-auto min-h-[500px] flex flex-col">
      <div id="tool-container" class="flex-1 w-full relative"></div>
    </div>
  </main>
  <tabkit-footer></tabkit-footer>
  <div id="toastContainer" class="fixed bottom-6 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const tool = await loadTool('image-compressor');
        const container = document.getElementById('tool-container');
        container.innerHTML = tool.render('image-compressor');
        tool.init('image-compressor');
      } catch (e) {
        console.error('Error loading tool:', e);
      }
    });
  </script>
</body>
</html>
